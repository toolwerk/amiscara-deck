[package]
name = "deck-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "amiscara-deckd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
deck-proto = { path = "../deck-proto" }
deck-ipc = { path = "../deck-ipc" }
deck-session = { path = "../deck-session" }
deck-usage = { path = "../deck-usage" }
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
