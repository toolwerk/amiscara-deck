[package]
name = "deck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "amiscara-deck"
path = "src/main.rs"

[dependencies]
deck-client = { path = "../deck-client" }
deck-daemon = { path = "../deck-daemon" }
deck-proto = { path = "../deck-proto" }
deck-hooks = { path = "../deck-hooks" }
deck-i18n = { path = "../deck-i18n" }
deck-sim = { path = "../deck-sim" }

serde_json = "1"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
