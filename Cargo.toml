[workspace]
members = [
    "crates/deck-proto",
    "crates/deck-i18n",
    "crates/deck-session",
    "crates/deck-daemon",
    "crates/deck-client",
    "crates/deck-remote",
    "crates/deck-hooks",
    "crates/deck-hook",
    "crates/deck-presence",
    "crates/deck-usage",
    "crates/deck-sim",
    "crates/deck-ffi",
    "crates/deck-cli",
    "crates/uniffi-bindgen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Frank Neumann-Staude <frank@staude.net>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
