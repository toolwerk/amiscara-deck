name: AmiscaraDeck
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  # The texts in the code are English; German comes from po/de.po.
  developmentLanguage: en
  # The texts for the app (Generated/i18n/<lang>.lproj, from po/ by
  # scripts/i18n.py): xcodegen only takes up folders that exist, so they are
  # written before the project. The build phase "Texts" keeps them current.
  preGenCommand: python3 ../../scripts/i18n.py apple Generated/i18n
  # Xcode checks for the XCFramework while planning, before any target runs,
  # so a fresh checkout needs it before the first build.
  postGenCommand: test -d Generated/DeckFFI.xcframework || ../../scripts/build-ffi.sh debug
packages:
  # Updates of the Mac app from the releases on GitHub.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "7N2W4T6UPV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # The pre-build scripts run cargo and write Generated/, outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AmiscaraDeck:
    type: application
    platform: macOS
    sources:
      - path: AmiscaraDeck
        excludes:
          - "**/.DS_Store"
      # Generated by scripts/build-ffi.sh, not checked in.
      - path: Generated/deck_ffi.swift
        optional: true
      # en.lproj and de.lproj with Localizable.strings, from po/ (not checked in).
      - path: Generated/i18n
        buildPhase: resources
    dependencies:
      # Builds the framework first; see aggregateTargets.
      - target: DeckFFI
      - framework: Generated/DeckFFI.xcframework
        embed: false
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.deck
        PRODUCT_NAME: AmiscaraDeck
        INFOPLIST_FILE: AmiscaraDeck/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    entitlements:
      path: AmiscaraDeck/AmiscaraDeck.entitlements
      properties:
        # Distributed with Developer ID, not through the App Store. The app
        # starts the daemon, talks to its socket and changes the settings of
        # Claude Code in the home folder, which the sandbox would block.
        com.apple.security.app-sandbox: false
    info:
      path: AmiscaraDeck/Info.plist
      properties:
        CFBundleDisplayName: Amiscara Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        # A menu bar app: no icon in the Dock, no main menu bar of its own.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Frank Neumann-Staude"
        ITSAppUsesNonExemptEncryption: false
        # Sparkle: the feed is an asset of the release `updates`, replaced with
        # each release (docs/release.md). The public key belongs to the private
        # key in the keychain of the one who releases (account amiscara-deck).
        SUFeedURL: https://github.com/toolwerk/amiscara-deck/releases/download/updates/appcast.xml
        SUPublicEDKey: KqFt0gy34ymw3g8KD6zagv7Pdbv7q5p6XeXrku/tvGQ=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    preBuildScripts:
      # po/ changed since the project was made: the tables follow before the
      # resources are copied. Python 3 of the system, as in a minimal PATH.
      - name: Texts
        script: |
          /usr/bin/env python3 "$SRCROOT/../../scripts/i18n.py" apple "$SRCROOT/Generated/i18n"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # The daemon, the hook program and the command line live inside the app,
      # next to each other, so `deck-hook` has a stable path (Codex asks for
      # new trust when an entry changes).
      - name: Embed helpers
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then profile=release; else profile=debug; fi
          "$SRCROOT/../../scripts/embed-helpers.sh" "$profile" "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
        basedOnDependencyAnalysis: false
  AmiscaraDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AmiscaraDeckTests
    dependencies:
      - target: AmiscaraDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.amiscara.deck.tests
        GENERATE_INFOPLIST_FILE: YES
aggregateTargets:
  # Runs scripts/build-ffi.sh before the app target, as a target of its own: a
  # script phase inside the app target cannot produce the framework the same
  # target links (Xcode reports a cycle or races the script).
  DeckFFI:
    settings:
      SUPPORTED_PLATFORMS: "macosx"
      SDKROOT: auto
    buildScripts:
      - name: Build deck-ffi
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then profile=release; else profile=debug; fi
          "$SRCROOT/../../scripts/build-ffi.sh" "$profile"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/DeckFFI.xcframework
          - $(SRCROOT)/Generated/deck_ffi.swift
schemes:
  AmiscaraDeck:
    build:
      targets:
        AmiscaraDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmiscaraDeckTests
      # The tests check the German texts; English ones set L10n.language.
      environmentVariables:
        DECK_LANGUAGE: de
