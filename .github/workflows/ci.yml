name: CI

# Pushes to main and pull requests from branches of this repository run on the
# runners of the organization (ci-lin-01, ci-mac-01). Pull requests from forks
# run on the hosted runners of GitHub.
#
# This is only a default: a fork can change this file. What protects the own
# machines is the setting "require approval for all external contributors".
# Before approving a run from outside, read every change under .github/.
# Pull requests use `pull_request`, never `pull_request_target`. No job uses
# a secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: python3 scripts/release_notes_test.py
      - run: python3 scripts/release-notes.py check
      - run: python3 scripts/i18n_test.py
      - run: python3 scripts/i18n.py check
      - run: python3 appcast_test.py
        working-directory: scripts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            hosted: ubuntu-latest
          - os: macOS
            hosted: macos-latest
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(format('["self-hosted","{0}"]', matrix.os)) || matrix.hosted }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked

  app:
    name: Mac app
    # macOS 27 SDK.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS"]') || 'xcode-27' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/AmiscaraDeck
      # Minimal PATH, as Xcode build phases have it. No signing in CI.
      - run: env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" xcodebuild -project apps/AmiscaraDeck/AmiscaraDeck.xcodeproj -scheme AmiscaraDeck -derivedDataPath target/xcode CODE_SIGNING_ALLOWED=NO test

  windows:
    name: Windows
    # There is no runner of our own with Windows: hosted for everyone.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The crates that run on Windows. The others belong to the Mac app.
      - run: cargo clippy --locked --all-targets -p deck-proto -p deck-ipc -p deck-hooks -p deck-hook -p deck-client -p deck-daemon -p deck-sim -p deck-cli -- -D warnings
      - run: cargo test --locked -p deck-proto -p deck-ipc -p deck-hooks -p deck-hook -p deck-client -p deck-daemon -p deck-sim -p deck-cli
      - run: cargo build --locked --release -p deck-daemon -p deck-hook -p deck-cli
      - run: pwsh -File scripts/windows/smoke.ps1 target/release
      - name: Package
        shell: pwsh
        run: |
          $dir = 'amiscara-deck-windows-x86_64'
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/amiscara-deckd.exe, target/release/deck-hook.exe, target/release/amiscara-deck.exe, scripts/windows/install.ps1, README.md, README.en.md, LICENSE-MIT, LICENSE-APACHE $dir
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amiscara-deck-windows-x86_64
          path: amiscara-deck-windows-x86_64
          retention-days: 14

  wsl:
    name: Windows with WSL
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --locked --release -p deck-daemon -p deck-hook -p deck-cli
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Debian-13
      - run: pwsh -File scripts/windows/wsl-smoke.ps1 target/release

  desktop:
    name: Desktop app (${{ matrix.os }})
    # Hosted: the Linux build needs WebKitGTK, which our runner does not have.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/deck-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/deck-desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxcb-randr0-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --check
        working-directory: apps/deck-desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/deck-desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/deck-desktop/src-tauri
      - run: npx tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amiscara-deck-desktop-${{ matrix.os }}
          path: |
            apps/deck-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/deck-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/deck-desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14
